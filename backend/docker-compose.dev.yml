version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: decantre-backend-live
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
    volumes:
      - .:/app
      - /app/node_modules
      - /var/www/uploads:/app/src/uploads
