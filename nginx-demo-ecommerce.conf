upstream demo_backend_upstream {
    server 127.0.0.1:5095;
    keepalive 32;
}

# 1. HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name api.plexivia.online;
    return 301 https://$host$request_uri;
}

# 2. HTTPS Server for api.plexivia.online
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.plexivia.online;

    ssl_certificate /etc/letsencrypt/live/admin.plexivia.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.plexivia.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Local Uploads Staging
    location /uploads/ {
        alias /opt/demo/uploads/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
    }

    # API Routes & WebSocket / Socket.IO
    location / {
        proxy_pass http://demo_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
