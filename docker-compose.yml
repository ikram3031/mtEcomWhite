services:
  mongodb:
    image: mongo:7.0
    container_name: ${MONGODB_CONTAINER_NAME:-decantre-mongodb-dev}
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-11223345}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-perfume-store}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb-data-dev:/data/db
    networks:
      - decantre-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${BACKEND_CONTAINER_NAME:-decantre-backend-dev}
    restart: always
    env_file:
      - .env
    environment:
      PORT: ${BACKEND_PORT:-5092}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5092}:${BACKEND_PORT:-5092}"
    volumes:
      - /decantre/uploads:/app/uploads
    depends_on:
      - mongodb
    networks:
      - decantre-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${FRONTEND_CONTAINER_NAME:-decantre-frontend-dev}
    restart: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8001}:8001"
    networks:
      - decantre-network

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    container_name: ${DASHBOARD_CONTAINER_NAME:-decantre-dashboard-dev}
    restart: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8005}:8005"
    networks:
      - decantre-network

networks:
  decantre-network:
    driver: bridge

volumes:
  mongodb-data-dev:
    driver: local