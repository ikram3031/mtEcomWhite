services:
  mongodb:
    image: mongo:7.0
    container_name: ${MONGODB_CONTAINER_NAME}
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    # MongoDB exposed publicly on dynamic MONGODB_PORT
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - client-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${BACKEND_CONTAINER_NAME}
    restart: always
    # .env ফাইল VPS এর fixed path থেকে mount করা হচ্ছে
    # ব্রাঞ্চ সুইচ বা git pull করলে এই ফাইল কখনো overwrite হবে না
    volumes:
      - /opt/${CLIENT_NAME}/configs/backend.env:/app/.env:ro
      - /opt/${CLIENT_NAME}/uploads:/app/uploads
      - /var/www/uploads:/app/src/uploads
    environment:
      PORT: ${BACKEND_PORT:-5092}
    ports:
      - "${BACKEND_PORT:-5092}:${BACKEND_PORT:-5092}"
    depends_on:
      - mongodb
    networks:
      - client-network

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: ${DASHBOARD_CONTAINER_NAME}
    restart: always
    # dashboard এর .env ও আলাদা fixed path থেকে mount
    volumes:
      - /opt/${CLIENT_NAME}/configs/dashboard.env:/app/.env:ro
    ports:
      - "${DASHBOARD_PORT:-8005}:8005"
    networks:
      - client-network

networks:
  client-network:
    driver: bridge

volumes:
  mongodb-data:
    driver: local